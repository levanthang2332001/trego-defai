syntax = "proto3";

package core;

import "candles.proto";

// Risk management parameters
message RiskParams {
  double max_leverage = 1;
  double max_position_size = 2;
  bool allow_new_orders = 3;
}

// Command types for engine control
enum CommandType {
  START = 0;
  STOP = 1;
  FLAT_ALL = 2;
  PAUSE_NEW = 3;
  RESUME = 4;
}

// Engine command
message EngineCommand {
  CommandType command = 1;
  string reason = 2;
}

// Real-time metrics from the trading engine
message Metric {
  int64 timestamp = 1;
  string symbol = 2;
  double mid_price = 3;
  double bid_price = 4;
  double ask_price = 5;
  double spread = 6;        // Bid-ask spread percentage
  double volume_24h = 7;    // 24h trading volume
  double price_change_24h = 8;  // 24h price change percentage
  string state = 9;
  int64 heartbeat_counter = 10;
}

message TradingParams {
  double risk_per_trade = 1;
  double k_factor = 2;
  double min_spread= 3;
  double max_spread= 4;
  double order_size = 5;
}

// Request/Response messages
message SetParamsRequest {
  int64 market_id = 1;
  TradingParams params = 2;
}

message SetParamsResponse {
  bool success = 1;
  string message = 2;
}

message UpdateRiskRequest {
  RiskParams risk_params = 1;
}

message UpdateRiskResponse {
  bool success = 1;
  string message = 2;
}

message SendCommandRequest {
  EngineCommand command = 1;
}

message SendCommandResponse {
  bool success = 1;
  string message = 2;
}

message StreamMetricsRequest {
  // Empty for now, could add filtering later
}

message TestWebSocketRequest {
  string address = 1;
}

message TestWebSocketResponse {
  bool success = 1;
  string message = 2;
}

// Core trading engine service
service TradingCore {
  // Test WebSocket connection
  rpc TestWebSocket(TestWebSocketRequest) returns (TestWebSocketResponse);

  // Set trading parameters
  rpc SetParams(SetParamsRequest) returns (SetParamsResponse);

  // Update risk parameters
  rpc UpdateRisk(UpdateRiskRequest) returns (UpdateRiskResponse);

  // Send control commands
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);

  // Stream real-time metrics
  rpc StreamMetrics(StreamMetricsRequest) returns (stream Metric);

  // Get market candles
  rpc GetCandles(GetCandlesRequest) returns (GetCandlesResponse);
}
