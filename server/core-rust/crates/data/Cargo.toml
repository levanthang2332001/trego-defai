[package]
name = "data"
version = "0.1.0"
edition = "2021"

[dependencies]
# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
tracing = "0.1"

# Concurrency
parking_lot = "0.12"

# Metrics
prometheus = "0.13"

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Local dependencies
types = { path = "../types" }
